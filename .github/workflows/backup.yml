name: Auto Backup

on:
  # Zamanlanmış yedek KAPALI: program-içi yedek (githubBackupService) kullanıyor.
  # Çakışmaması için Actions buradan yazmaz; elle tetiklenebilir.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Export from panel
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          EXPORT_PASS: ${{ secrets.EXPORT_PASS }}
        run: |
          set -e
          [ -n "$PANEL_URL" ] || { echo "PANEL_URL secret eksik"; exit 1; }
          [ -n "$ADMIN_USER" ] || { echo "ADMIN_USER secret eksik"; exit 1; }
          [ -n "$ADMIN_PASS" ] || { echo "ADMIN_PASS secret eksik"; exit 1; }
          [ -n "$EXPORT_PASS" ] || { echo "EXPORT_PASS secret eksik"; exit 1; }
          PANEL_URL="$(printf '%s' "$PANEL_URL" | tr -d '[:space:]')"
          case "$PANEL_URL" in
            http://*|https://*) echo "adres semasi tamam";;
            *) echo "adrese https:// eklendi"; PANEL_URL="https://$PANEL_URL";;
          esac
          PANEL_URL="${PANEL_URL%/}"
          echo "adres uzunlugu: ${#PANEL_URL}, basi: [${PANEL_URL:0:8}]"
          host="${PANEL_URL#https://}"; host="${host#http://}"; host="${host%%/*}"
          getent hosts "$host" || echo "UYARI: DNS cozulemedi: $host"
          echo "Panel bekleniyor (en fazla 5 dk)..."
          WARMED=""
          for i in $(seq 1 30); do
            if code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$PANEL_URL/"); then :; else code="000"; fi
            echo "deneme $i -> $code"
            if [ "$code" = "200" ]; then WARMED=1; break; fi
            sleep 10
          done
          [ -n "$WARMED" ] || { echo "panel 200 donmedi"; exit 1; }
          echo "Giris yapiliyor (en fazla 5 dk deneme)..."
          TOKEN=""
          for i in $(seq 1 10); do
            out=$(curl -s -w "\n%{http_code}" --max-time 30 -X POST "$PANEL_URL/api/login" -H "Content-Type: application/json" -d "{\"username\":\"$ADMIN_USER\",\"password\":\"$ADMIN_PASS\"}" || echo "BAGLANAMADI")
            http=$(echo "$out" | tail -n1)
            body=$(echo "$out" | head -n -1)
            echo "giris deneme $i -> http $http"
            TOKEN=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('token') or '')" 2>/dev/null || echo "")
            if [ -n "$TOKEN" ]; then break; fi
            sleep 30
          done
          [ -n "$TOKEN" ] || { echo "giris basarisiz"; exit 1; }
          echo "Disari aktariliyor..."
          mkdir -p backups
          f="backups/backup-$(date +%Y%m%d-%H%M).bin"
          curl -s --max-time 120 -X POST "$PANEL_URL/api/export" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"password\":\"$EXPORT_PASS\"}" -o "$f"
          ls -lh backups/
          first=$(head -c 1 "$f")
          if [ "$first" = "{" ]; then echo "export hata dondu:"; cat "$f"; echo ""; exit 1; fi
          test -s "$f" || (echo "yedek bos"; exit 1)
          echo "TAMAM: $f"
      - name: Commit backup (backups dalina - main'e dokunmaz, Render yeniden baslamaz)
        run: |
          git config user.name "backup-bot"
          git config user.email "backup@steamix.local"
          git add backups/
          git diff --cached --quiet && echo "degisiklik yok" || git commit -m "auto backup $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin HEAD:backups || echo "push yapilmadi"
