name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # her 5 dk: 14 dk Render'in 15 dk uyku sinirina cok yakindi, bir atlama uyutuyordu
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Render servislerini uyanık tut (panel + site)
        run: |
          # Not: adim `bash -e` ile calisir; curl zaman asiminda (exit 28)
          # adimin erken olmemesi icin `|| echo "000"` kalkandir.
          # Site ayrica pinglenir: ona ping atan yoktu, gece uykuya daliyordu.
          for url in "https://xtreamcodes-rvn1.onrender.com/" "https://steamixiptv.onrender.com/"; do
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$url" || echo "000")
              echo "ping $i $url -> HTTP $code"
              if [ "$code" = "200" ] || [ "$code" = "302" ] || [ "$code" = "403" ]; then
                echo "OK - ayakta: $url"
                break
              fi
              sleep 10
            done
          done